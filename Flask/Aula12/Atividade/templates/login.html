<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Sistema de Eventos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .form-login {
      max-width: 400px;
      margin: auto;
      padding: 2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background-color: #007BFF;
      border: none;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>

  <div class="container d-flex align-items-center justify-content-center vh-100">
    <form class="form-login" method="POST" action="/login">
      <h2 class="text-center mb-4">Acesso ao Sistema</h2>

      <div class="text-center mb-4">
        <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" alt="Login Icon" width="80" height="80"
          class="mb-3">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="lembrar" name="lembrar">
        <label class="form-check-label" for="lembrar">Lembrar-me</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">Entrar</button>

      <div class="mt-3 text-center">
        <a href="#">Esqueceu a senha?</a>
      </div>
      <div class="container mt-3 d-flex justify-content-center">
        <a href="/" class="btn btn-secondary">Voltar para Home</a>
      </div>
    </form>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
