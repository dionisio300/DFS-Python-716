{% extends 'base.html' %}

{% block conteudo %}

<div class="container-fluid">
    <div class="row justify-content-center my-5">
        <div class="col-4 border">
            <h2 class="text-center my-4">Acesso ao sistema</h2>

            <div class="text-center mb-4">
                <i class="bi bi-person-circle" style="font-size: 80px;"></i>
            </div>

            <div class="formularioLogin">
                <form action="{{url_for('login')}}" method="post">
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">E-mail</label>
                        <input name="email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Digite seu e-mail">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Senha</label>
                        <input name="senha" type="password" class="form-control" id="exampleInputPassword1" placeholder="Digite sua senha">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1" name="lembrar">
                        <label class="form-check-label" for="exampleCheck1">Lembrar me</label>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary w-50">Entrar</button>
                    </div>
                    <div class="mt-4">
                        <a href="">Esqueceu a senha?</a> / <a href="">Cadastre-se</a>
                    </div>
                    <div class="my-4">
                        <a class="btn btn-danger" href="{{url_for('home')}}">Voltar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>




{% endblock %}
