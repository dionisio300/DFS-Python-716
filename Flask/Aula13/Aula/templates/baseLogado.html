<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-Vindo {{nome}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark text-light" data-bs-theme="dark" style="height:100px;">
        <div class="container d-flex justify-content-between fs-6">

            <div>
                <a class="navbar-brand text-light fw-bold fs-2" href="#">SGE</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

            </div>

            <div>
                <div class="collapse navbar-collapse " id="navbarNav">
                    <ul class="navbar-nav me-3">
                        <li class="nav-item me-3">
                            <a class="nav-link active " aria-current="page" href="#">Home</a>
                        </li>
                        
                        <li class="nav-item me-3">
                            {% if tipo == 'cliente'%}
                                <a class="nav-link " href="#">Meus Eventos</a>
                            {% elif tipo == 'usuario' %}
                                <a class="nav-link " href="#">Meus Eventos</a>
                            {% elif tipo == 'administrador' %}
                                <a class="nav-link " href="#">Gerenciar Eventos</a>
                            {% endif %}
                        </li>
                        <li class="nav-item me-3">
                            <a class="nav-link " href="#">Pricing</a>
                        </li>
                        <li class="nav-item me-3">
                            <a href="{{url_for('sair')}}" class="btn btn-danger">Sair</a>
                        </li>
                    </ul>
                </div>

            </div>


        </div>
    </nav>

    {% block conteudo %}

    {% endblock %}

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>

</html>
