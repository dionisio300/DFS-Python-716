{% extends 'base.html' %}

{% block conteudo %}

<div class="container-fluid">
    <div class="row justify-content-center my-5">
        <div class="col-4 border">
            <h2 class="text-center my-4">Crie sua Conta</h2>
            <h2 class="text-center my-4">Cadastre-se para acessar todas as funcinalidades do SGE.</h2>
            <div class="text-center mb-4">
                <i class="bi bi-person-add" style="font-size: 80px"></i>
            </div>
            <div class="formularioCadastro">
                <form action="{{url_for('cadastro')}}" method="post">
                    <div class="form-group">
                        <label for="exampleInputName">Nome completo</label>
                        <input name="name" type="name" class="form-control" id="exampleInputName"
                            aria-describedby="nameHelp" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="exampleInputName">Nome de usuário</label>
                        <input name="username" type="name" class="form-control" id="exampleInputName"
                            aria-describedby="nameHelp" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="exampleInputEmail1">Endereço de correio eletrônico</label>
                        <input name="email" type="email" class="form-control" id="exampleInputEmail1"
                            aria-describedby="emailHelp" placeholder="">
                    </div>
                    <div class="form-group">
                        <label for="accountType">Tipo de conta</label>
                        <select name="accountType" class="form-control" id="accountType"
                            aria-describedby="accountTypeHelp">
                            <option value="">Selecione o tipo de conta</option>
                            <option value="administrador">Administrador</option>
                            <option value="cliente">Cliente</option>
                            <option value="usuario">Usuário</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="exampleInputPassword1">Senha</label>
                        <input name="senha" type="password" class="form-control" id="exampleInputPassword1"
                            placeholder="">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary w-50">Cadastrar</button>
                    </div>
                    <div class="text-center mt-4">
                        <a href="">Conecte-se</a>
                    </div>
                    <div class="my-4">
                        <a class="btn btn-danger" href="{{url_for('home')}}">Voltar</a>
                    </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
