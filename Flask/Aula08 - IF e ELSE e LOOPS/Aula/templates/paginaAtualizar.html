{% extends 'base.html' %}

{% block conteudo %}

<h1>Essa é a página de Atualização de evento</h1>

Mostrar Evento = {{mostrarEvento}}

{% if mostrarEvento %}

<h3>Atualizar Informações</h3>

<form action="{{url_for('atualizarEvento')}}" method="post">
    <div>
        <label for="nome">Nome: </label>
        <input id="nome" name="nome" type="text" value="{{eventoSelecionado['nome']}}">
    </div>
    <br>
    <div>
        <label for="data">Data: </label>
        <input id="data" name="data" type="text" value="{{eventoSelecionado['data']}}">
    </div>
    <br>
    <div>
        <label for="local">Local: </label>
        <input id="local" name="local" type="text" value="{{eventoSelecionado['local']}}">
    </div>
    <br>
    <div>
        <label for="hora">Hora: </label>
        <input id="hora" name="hora" type="text" value="{{eventoSelecionado['hora']}}">
    </div>
    <br>
    <div>
        <label for="lotacao">Lotação: </label>
        <input id="lotacao" name="lotacao" type="text" value="{{eventoSelecionado['lotacao']}}">
    </div>
    <br>
    <div>
        <input id="id_evento" name="id_evento" type="hidden" value="{{id}}">
    </div>

    <input type="submit" value="Enviar">
    
</form>

{% else %}

<h3>Entrou no else</h3>

<p>Digite o ID do evento a ser atualizado</p>

<form method="post" action="{{url_for('paginaAtualizar')}}">
    <input type="text" id="id" name="id">
    <input type="submit" value="Enviar">
</form>


{% endif %}


{% endblock %}
