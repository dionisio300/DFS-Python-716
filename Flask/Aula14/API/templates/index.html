<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de APIs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <div class="container">
        <h1 class="mt-5 text-center">Consumindo APIs</h1>
        <div class="row justify-content-center ">
            <div class="col-6 border border-dark rounded-3 p-3 mt-5">
                
                {% if erro %}

                <h1>Erro ao consultar o CEP! Tente novamente</h1>
                <a href="{{url_for('paginaInicial')}}">Click aqui</a>

                {% else %}
                <form action="{{url_for('mostrarEndereco')}}" method="post">
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="nome">
                        
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="exampleInputPassword1" placeholder="Ex: 88888888" maxlength="8" name="cep">
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>

                {% endif %}



            </div>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>


</html>
